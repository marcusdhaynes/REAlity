[package]
name = "reality-native-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
craft-anything-disasm = { git = "https://github.com/storytold/craft-anything", rev = "48a9c5a60ff83ff620f98661339be6281a7debc6" }
