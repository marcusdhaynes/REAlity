name: Deploy REAlity to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/browser.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: reality-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser recovery and publishing modules
        run: |
          node --test tests/browser.test.mjs
          node --check docs/workbench.mjs
          node --check docs/recovery-worker.mjs
      - name: Verify static entry point
        run: |
          test -s docs/index.html
          grep -q 'REAlity' docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
