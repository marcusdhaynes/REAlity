name: REAlity CI and Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python -m compileall recovery.py desktop.py
  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.11.1
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --add-data "REAlity-Offline.html;." --name REAlity desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: REAlity-Windows
          path: dist/REAlity.exe
          if-no-files-found: error

  publish-windows:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: REAlity-Windows
          path: release
      - name: Publish immutable preview build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" release/REAlity.exe --target "$GITHUB_SHA" --prerelease --title "REAlity Preview $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" --notes "Automated Windows preview. Static recovery is implemented; external providers and full reconstruction remain experimental."
